<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques par élève</title>
<style>
	.show { display: flex; }
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #eee;
  min-width: 160px;
}

.dropdown-content a {
  display: block;
  padding: 10px;
  text-decoration: none;
  color: black;
}

.dropdown-content a:hover {
  background-color: #ccc;
}

.show {
  display: block;
}
</style>
</head>

<body>

<div class="dropdown">
  <button onclick="afficheMenu()">Statistiques</button>

  <div id="menu" class="dropdown-content">
    <a href="#">Par dates</a>
    <a href="#">Par années</a>
	<a href="#">Par classes</a>
	<a href="#">Meilleures perfs</a>
	<a href="main.html">Accueil</a>
  </div>
</div>
<script>
function afficheMenu() {
  document.getElementById("menu").classList.toggle("show");
  }
</script>
</body>
</html>
