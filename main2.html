<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dashboard élèves</title>

<style>
body {
  margin: 0;
  font-family: Arial;
}

/* ===== Layout ===== */
.container {
  display: flex;
  height: 100vh;
}

/* ===== Menu ===== */
.menu {
  width: 200px;
  background: #222;
  color: white;
  padding: 20px;
}

.menu button {
  width: 100%;
  padding: 10px;
  cursor: pointer;
}

/* dropdown */
.dropdown-content {
  display: none;
  background: #444;
  margin-top: 10px;
}

.dropdown-content a {
  display: block;
  padding: 10px;
  color: white;
  text-decoration: none;
}

.dropdown-content a:hover {
  background: #666;
}

.show-menu {
  display: block;
}

/* ===== Contenu ===== */
.content {
  flex: 1;
  padding: 20px;
}

/* sections */
section {
  margin-bottom: 30px;
}

/* carte commune */
.card {
  width: 120px;
  height: 140px;
  background: #f2f2f2;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

/* bouton ajouter */
.ajouter .plus {
  width: 40px;
  height: 40px;
  background: #4CAF50;
  color: white;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  margin-bottom: 10px;
}
/* ===== Tout ce qui est relatif aux élèves ===== */
.eleves-container {
  display: flex;
  flex-wrap: wrap;
}
.prenom {
display : flex;
margin-top : 100px;
}
.reste {
display : flex;
margin-top : 5px;
}
.first_point {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
  margin-top : 5px;
}
.points {
display: flex;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
}
.point2 {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background : #008000
}
.point1 {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background : #FF0000
}
/* ===== Popup ===== */
.overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  backdrop-filter: blur(5px);
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
}

.show-overlay {
  display: flex;
}

.popup {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

</style>
</head>

<body>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <button onclick="toggleMenu()">Statistiques</button>

    <div id="menu" class="dropdown-content">
      <a href="#">Par élève</a>
      <a href="#">Par dates</a>
      <a href="#">Par années</a>
      <a href="#">Par classes</a>
      <a href="#">Meilleures perfs</a>
    </div>
  </div>

  <!-- CONTENU -->
  <div class="content">

    <!-- DATE -->
    <section>
      <h2>Date</h2>
      <input type="date">
    </section>

    <!-- ELEVES -->
    <section>
      <h2>Élèves</h2>

      <div class="card ajouter" onclick="ouvrir()">
	<div class="plus">+</div>
	<p>Ajouter élève</p>
	</div>

      <div id="listeEleves" class="eleves-container"></div>
    </section>

  </div>
</div>

<!-- POPUP -->
<div id="overlay" class="overlay">
  <div class="popup">
    <h2>Ajouter un élève</h2>

    <form id="formEleve">
      <input type="text" name="nom" placeholder="Nom" required><br><br>
      <input type="text" name="prenom" placeholder="Prénom" required><br><br>
      <input type="text" name="classe" placeholder="Classe" required><br><br>

      <button type="submit">Valider</button>
    </form>
  </div>
</div>

<script>
let eleves = [];

// ===== MENU =====
function toggleMenu() {
  document.getElementById("menu").classList.toggle("show-menu");
}

// ===== POPUP =====
function ouvrir() {
  document.getElementById("overlay").classList.add("show-overlay");
}

function fermer() {
  document.getElementById("overlay").classList.remove("show-overlay");
}

// ===== FORM =====
document.getElementById("formEleve").addEventListener("submit", function(e){
  e.preventDefault();

  const nom = this.nom.value;
  const prenom = this.prenom.value;
  const classe = this.classe.value;

  ajouterEleve(nom, prenom, classe);

  this.reset();
  fermer();
});

// ===== AJOUT ELEVE =====
function ajouterEleve(nom, prenom, classe) {
  eleves.push({ nom, prenom, classe });

  let card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class = "prenom">
	${nom}
	</div>
	<div class = "reste">
	${prenom}
	</div>
	<div class = "reste">
	${classe}
	</div>
    <div class="first_point">
      ${"<div class='point1'></div>".repeat(5)}
    </div>
	<div class="points">
      ${"<div class='point2'></div>".repeat(5)}
    </div>
	<div class="points">
      ${"<div class='point2'></div>".repeat(5)}
    </div>
  `;

  document.getElementById("listeEleves").appendChild(card);
}
</script>

</body>
</html>
